kind = "web"
previewPath = "/"
title = "AI Data Center Simulator"
version = "1.0.0"
id = "artifacts/ai-datacenter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20777

[services.development]
run = "pnpm --filter @workspace/ai-datacenter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-datacenter", "run", "build" ]
publicDir = "artifacts/ai-datacenter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20777"
BASE_PATH = "/"
